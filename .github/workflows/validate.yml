name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Both jobs install over a fake home that already holds an old copy plus a backup beside it
# (as the 1.2.0 installer left them), update from the built package while running from the
# installed copy, and check that skills/ ends up holding only model-grade and mg, with every
# backup under model-grade-backups/. Then they install from a clone that already sits at
# skills/model-grade (the git route), which must leave that folder alone. Because the package
# carries .claude-plugin/plugin.json, which registers the executors, a stale executor copy in
# agents/ must move to the backups and nothing may be copied there; a copy without the manifest
# must still get the executors in agents/.

jobs:
  check:
    name: Self-check and installer smoke test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository self-check
        run: python scripts/check_repo.py
      - name: Build the package
        run: python scripts/build_package.py --out "$RUNNER_TEMP/pkg/model-grade-install.zip"
      - name: Install over an old copy and a leftover backup
        run: |
          home="$RUNNER_TEMP/fakehome/.claude"
          mkdir -p "$home/skills/model-grade" "$home/skills/model-grade.bak-20260101-000000"
          echo 0.0.0 > "$home/skills/model-grade/VERSION"
          echo old > "$home/skills/model-grade/SKILL.md"
          echo older > "$home/skills/model-grade.bak-20260101-000000/SKILL.md"
          mkdir -p "$home/agents"
          echo stale > "$home/agents/mg-run-low.md"
          echo mine > "$home/agents/my-own-agent.md"
          CLAUDE_HOME="$home" bash install.sh
      - name: Update from the package, run from the installed copy
        run: |
          set -eo pipefail
          home="$RUNNER_TEMP/fakehome/.claude"
          sleep 1
          MODEL_GRADE_HOME="$home" MODEL_GRADE_ZIP="$RUNNER_TEMP/pkg/model-grade-install.zip" bash "$home/skills/model-grade/scripts/update.sh" | tee "$RUNNER_TEMP/update.log"
          # No claude CLI on the runner: the update must still succeed and say it skipped the check.
          tail -1 "$RUNNER_TEMP/update.log" | grep -q "Claude Code check skipped"
      - name: Claude Code version check (older, current, missing)
        run: |
          set -e
          check="$RUNNER_TEMP/fakehome/.claude/skills/model-grade/scripts/check_claude_code.sh"
          want="$(cat CLAUDE_CODE_VERSION)"
          shim="$RUNNER_TEMP/shim"; mkdir -p "$shim"
          printf '#!/bin/sh\necho "0.0.1 (Claude Code)"\n' > "$shim/claude"; chmod +x "$shim/claude"
          PATH="$shim:$PATH" bash "$check" | grep -q "Run 'claude update'"
          printf '#!/bin/sh\necho "%s (Claude Code)"\n' "$want" > "$shim/claude"
          out="$(PATH="$shim:$PATH" bash "$check")"
          echo "$out" | grep -q ": ok$"
          if echo "$out" | grep -q "claude update"; then echo "recommended an update at $want"; exit 1; fi
          bash "$check" | grep -q "not on PATH"
          echo "version check ok"
      - name: Verify the layout
        run: |
          set -e
          home="$RUNNER_TEMP/fakehome/.claude"
          test -f "$home/skills/model-grade/SKILL.md"
          test -f "$home/skills/mg/SKILL.md"
          test -f "$home/skills/model-grade/.claude-plugin/plugin.json"
          if ls "$home/agents"/mg-run-*.md >/dev/null 2>&1; then echo "executor copies left in agents/"; exit 1; fi
          test -f "$home/agents/my-own-agent.md"
          ls "$home"/model-grade-backups/*-agents/mg-run-low.md >/dev/null
          dirs="$(ls -1 "$home/skills" | sort | paste -sd, -)"
          test "$dirs" = "mg,model-grade" || { echo "skills/ holds [$dirs]"; exit 1; }
          test -d "$home/model-grade-backups/model-grade.bak-20260101-000000"
          test "$(ls -1 "$home/model-grade-backups" | grep -Ec '^[0-9]{8}-[0-9]{6}$')" -ge 2
          echo "layout ok, executors left to the plugin manifest, backups kept outside skills/"
      - name: Install from a clone already at skills/model-grade (git route)
        run: |
          set -e
          home="$RUNNER_TEMP/fakehome2/.claude"
          mkdir -p "$home/skills"
          cp -R "$PWD" "$home/skills/model-grade"
          CLAUDE_HOME="$home" bash "$home/skills/model-grade/install.sh"
          test -f "$home/skills/model-grade/SKILL.md"
          test ! -e "$home/model-grade-backups"
          test "$(ls -1 "$home/skills" | sort | paste -sd, -)" = "mg,model-grade"
          if ls "$home/agents"/mg-run-*.md >/dev/null 2>&1; then echo "copied executors despite the manifest"; exit 1; fi
          echo "in-place install ok"
      - name: Install a copy without the plugin manifest (executors copied)
        run: |
          set -e
          home="$RUNNER_TEMP/fakehome3/.claude"
          src="$RUNNER_TEMP/nomanifest"
          cp -R "$PWD" "$src"
          rm -rf "$src/.claude-plugin"
          CLAUDE_HOME="$home" bash "$src/install.sh"
          test ! -e "$home/skills/model-grade/.claude-plugin"
          count="$(ls "$home/agents"/mg-run-*.md | wc -l)"
          test "$count" -ge 7
          echo "no-manifest install ok, $count executors"

  windows:
    name: Installer smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, install over an old copy, update from the installed copy, verify
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "fakehome\.claude"
          $zip = Join-Path $env:RUNNER_TEMP "pkg\model-grade-install.zip"
          python scripts/build_package.py --out $zip
          New-Item -ItemType Directory -Force -Path "$target\skills\model-grade", "$target\skills\model-grade.bak-20260101-000000" | Out-Null
          Set-Content "$target\skills\model-grade\VERSION" "0.0.0"
          Set-Content "$target\skills\model-grade\SKILL.md" "old"
          Set-Content "$target\skills\model-grade.bak-20260101-000000\SKILL.md" "older"
          New-Item -ItemType Directory -Force -Path "$target\agents" | Out-Null
          Set-Content "$target\agents\mg-run-low.md" "stale"
          Set-Content "$target\agents\my-own-agent.md" "mine"
          pwsh -File install.ps1 -Target $target
          if ($LASTEXITCODE) { throw "install.ps1 failed" }
          Start-Sleep -Seconds 1
          $log = pwsh -File "$target\skills\model-grade\scripts\update.ps1" -Target $target -ZipPath $zip 2>&1 | Out-String
          if ($LASTEXITCODE) { throw "update.ps1 failed:`n$log" }
          Write-Host $log
          if ($log -notmatch "Claude Code check skipped") { throw "update.ps1 did not run the Claude Code check" }
          if (-not (Test-Path "$target\skills\model-grade\SKILL.md")) { throw "skill missing" }
          if (-not (Test-Path "$target\skills\mg\SKILL.md")) { throw "alias missing" }
          if (-not (Test-Path "$target\skills\model-grade\.claude-plugin\plugin.json")) { throw "plugin manifest missing" }
          if (Test-Path "$target\agents\mg-run-*.md") { throw "executor copies left in agents\" }
          if (-not (Test-Path "$target\agents\my-own-agent.md")) { throw "an unrelated agent was moved" }
          if (-not (Test-Path "$target\model-grade-backups\*-agents\mg-run-low.md")) { throw "stale executor copy was not backed up" }
          $dirs = (Get-ChildItem "$target\skills" -Directory | Select-Object -ExpandProperty Name | Sort-Object) -join ","
          if ($dirs -ne "mg,model-grade") { throw "skills/ holds [$dirs]" }
          $baks = Get-ChildItem "$target\model-grade-backups" -Directory | Select-Object -ExpandProperty Name
          if ($baks -notcontains "model-grade.bak-20260101-000000") { throw "leftover backup was not moved" }
          if (($baks | Where-Object { $_ -match '^\d{8}-\d{6}$' }).Count -lt 2) { throw "previous copies were not backed up" }
          Write-Host "layout ok, executors left to the plugin manifest, backups kept outside skills/"
      - name: Claude Code version check (older, current, missing)
        shell: pwsh
        run: |
          $check = Join-Path $env:RUNNER_TEMP "fakehome\.claude\skills\model-grade\scripts\check_claude_code.ps1"
          $want = (Get-Content CLAUDE_CODE_VERSION -Raw).Trim()
          $shim = Join-Path $env:RUNNER_TEMP "shim"
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          $plain = $env:PATH
          $env:PATH = "$shim;$plain"
          Set-Content "$shim\claude.cmd" "@echo 0.0.1 (Claude Code)"
          $out = & $check 6>&1 | Out-String
          if ($out -notmatch "Run 'claude update'") { throw "no update recommended for 0.0.1: $out" }
          Set-Content "$shim\claude.cmd" "@echo $want (Claude Code)"
          $out = & $check 6>&1 | Out-String
          if ($out -notmatch ": ok" -or $out -match "claude update") { throw "wrong result at ${want}: $out" }
          $env:PATH = $plain
          $out = & $check 6>&1 | Out-String
          if ($out -notmatch "not on PATH") { throw "missing CLI not reported: $out" }
          Write-Host "version check ok"
      - name: Install from a clone already at skills\model-grade (git route)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "fakehome2\.claude"
          New-Item -ItemType Directory -Force -Path "$target\skills" | Out-Null
          Copy-Item -Path $PWD.Path -Destination "$target\skills\model-grade" -Recurse
          pwsh -File "$target\skills\model-grade\install.ps1" -Target $target
          if ($LASTEXITCODE) { throw "install.ps1 failed" }
          if (-not (Test-Path "$target\skills\model-grade\SKILL.md")) { throw "in-place install lost the clone" }
          if (Test-Path "$target\model-grade-backups") { throw "in-place install made a backup" }
          $dirs = (Get-ChildItem "$target\skills" -Directory | Select-Object -ExpandProperty Name | Sort-Object) -join ","
          if ($dirs -ne "mg,model-grade") { throw "skills/ holds [$dirs]" }
          if (Test-Path "$target\agents\mg-run-*.md") { throw "copied executors despite the manifest" }
          Write-Host "in-place install ok"
      - name: Install a copy without the plugin manifest (executors copied)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "fakehome3\.claude"
          $src = Join-Path $env:RUNNER_TEMP "nomanifest"
          Copy-Item -Path $PWD.Path -Destination $src -Recurse
          Remove-Item -Recurse -Force "$src\.claude-plugin"
          pwsh -File "$src\install.ps1" -Target $target
          if ($LASTEXITCODE) { throw "install.ps1 failed" }
          if (Test-Path "$target\skills\model-grade\.claude-plugin") { throw "manifest appeared in a copy without one" }
          $agents = (Get-ChildItem "$target\agents" -Filter "mg-run-*.md").Count
          if ($agents -lt 7) { throw "expected at least seven executors, found $agents" }
          Write-Host "no-manifest install ok, $agents executors"
