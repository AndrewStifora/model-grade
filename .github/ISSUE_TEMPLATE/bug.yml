name: Bug
description: Something failed: install, update, --run, refresh, or the scripts.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Paste error output in a code block.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: model-grade version
      placeholder: "1.2.0"
  - type: input
    id: claude
    attributes:
      label: Claude Code version and OS
      placeholder: "2.1.280 on Windows 11 / macOS 15"
  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - Drag-and-drop zip
        - install.ps1 / install.sh
        - git clone
        - claude plugin install
